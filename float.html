<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .image {
            float: right;
            margin: 0 15px 15px 0;
            width: 100px;
            height: 100px;
            background-color: lightgray;
        }

        .text {
            overflow: hidden;
            background: #0088cc;
            /* agar container mengikuti float */
        }
    </style>
</head>

<body>
    <div class="text">
        <div class="image">Gambar</div>
        <p>Ini teks yang mengalir di sebelah gambar yang di-float kiri. Lorem ipsum dolor sit amet, consectetur
            adipiscing elit.</p>
    </div>
</body>

</html>
