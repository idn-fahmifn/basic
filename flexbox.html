<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      display: flex;
      gap: 20px; /* Jarak antar card */
      padding: 20px;
      justify-content: center;
      flex-wrap: wrap; /*Agar card bisa turun ke baris baru*/
    }
    .card {
      background-color: #f8f8f8;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 250px;
      padding: 15px;
      text-align: center;
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.2);
    }
    .card img {
      width: 100%;
      border-radius: 8px 8px 0 0;
    }
    .card h3 {
      margin: 15px 0 10px;
    }
    .card p {
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/PNG_transparency_demonstration_1.png/640px-PNG_transparency_demonstration_1.png" alt="Gambar 1">
    <h3>Judul Card 1</h3>
    <p>Deskripsi singkat tentang card pertama ini.</p>
  </div>
  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/PNG_transparency_demonstration_1.png/640px-PNG_transparency_demonstration_1.png" alt="Gambar 2">
    <h3>Judul Card 2</h3>
    <p>Deskripsi singkat tentang card kedua ini.</p>
  </div>
  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/PNG_transparency_demonstration_1.png/640px-PNG_transparency_demonstration_1.png" alt="Gambar 3">
    <h3>Judul Card 3</h3>
    <p>Deskripsi singkat tentang card ketiga ini.</p>
  </div>
</div>

</body>
</html>
