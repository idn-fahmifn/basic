<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .static-box {
            position: static;
            background-color: lightgray;
            padding: 10px;
        }

        .relative-box {
            position: relative;
            top: 10px;
            left: 20px;
            background-color: lightgreen;
            padding: 10px;
        }

        .absolute-box {
            position: absolute;
            top: 50px;
            right: 100px;
            background-color: lightcoral;
            padding: 10px;
        }

        .fixed-box {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background-color: lightblue;
            padding: 10px;
        }
    </style>


</head>

<body>
    <div class="static-box">Static (default)</div>
    <div class="relative-box">Relative (geser posisi)</div>
    <div class="absolute-box">Absolute (posisi tetap relatif parent)</div>
    <div class="fixed-box">Fixed (tetap di layar saat scroll)</div>

</body>

</html>
